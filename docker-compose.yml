services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kanban_dev
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    ports:
      - "3350:3350"
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/kanban_dev
      JWT_SECRET: dev-secret-key-kanban
      PORT: "3350"
      NODE_ENV: development
    volumes:
      - ./api:/app
      - /app/node_modules
      # columns.js/cards.js import the shared ../../../src/domain/ordering.js,
      # which lives at the repo root (outside the ./api build context). Mount it
      # at the path the import resolves to inside the container (/src/domain).
      - ./src/domain:/src/domain
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npm run migrate && npm run dev"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3300:3000"
    environment:
      API_PROXY_TARGET: http://api:3350
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  postgres_data:
